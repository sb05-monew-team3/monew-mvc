name: Monew Server CI/CD

on:
  push:
    branches: [ "main" ] # main 브랜치에 푸시될 때 실행

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 소스 코드 Checkout
      - name: Checkout
        uses: actions/checkout@v4

      # 2. JDK 17 설정
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Gradle 권한 부여
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # 4. Gradle 빌드 (Docker 이미지 빌드를 위해 .jar 파일 생성)
      - name: Build with Gradle
        run: ./gradlew clean build -x test

      # 5. AWS 자격 증명 설정
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # 6. Amazon ECR 로그인
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 7. Docker 이미지 빌드 및 태그
      - name: Build and tag Docker image
        id: build-image
        env:
          ECR_REPO_URI: ${{ secrets.ECR_REPOSITORY_URI }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # ECR_REPO_URI 전체를 이미지 이름으로 사용합니다. (예: .../monew-server:8713...)
          docker build -t $ECR_REPO_URI:$IMAGE_TAG .
          echo "image_uri=$ECR_REPO_URI:$IMAGE_TAG" >> $GITHUB_OUTPUT

      # 8. Docker 이미지를 ECR에 푸시
      - name: Push Docker image to ECR
        run: docker push ${{ steps.build-image.outputs.image_uri }}

      # 9. CodeDeploy 배포 생성
      - name: Create CodeDeploy Deployment
        id: deploy
        run: |
          aws deploy create-deployment \
            --application-name ${{ secrets.CODEDEPLOY_APP_NAME }} \
            --deployment-group-name ${{ secrets.CODEDEPLOY_DEPLOYMENT_GROUP_NAME }} \
            --deployment-config-name CodeDeployDefault.OneAtATime \
            --description "Deployment from GitHub Actions ${{ github.sha }}" \
            --s3-location bucket=${{ secrets.S3_BUCKET_FOR_CODEDEPLOY }},key=monew-server-deploy-${{ github.sha }}.zip,bundleType=zip \
            --ignore-application-stop-failures \
            --environment-variables '[{"name":"ECR_IMAGE_URI", "value":"${{ steps.build-image.outputs.image_uri }}", "type":"PLAINTEXT"}]'

      # 10. CodeDeploy 배포 완료 대기
      - name: Wait for CodeDeploy Deployment
        run: |
          aws deploy wait deployment-successful \
            --deployment-id ${{ fromJson(steps.deploy.outputs.stdout).deploymentId }}