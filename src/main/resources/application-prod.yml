spring:
  config:
    activate:
      on-profile: prod
  aws:
    accessKeyId: ${AWS_S3_ACCESS_KEY}
    secretKey: ${AWS_S3_SECRET_KEY}
    region: ${AWS_S3_REGION}
    s3:
      bucket: ${AWS_S3_BUCKET}
  boot:
    admin:
      client:
        enabled: true
        url: ${SPRING_BOOT_ADMIN_URL:http://localhost:9090}
        instance:
          name: monew_server
          service-url: ${SERVER_PUBLIC_URL:http://localhost:8080}
          management-base-url: ${MANAGEMENT_PUBLIC_URL:http://localhost:8081}
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_PROD_HOST}:${DB_PROD_PORT}/${DB_PROD_NAME}
    username: ${DB_PROD_USER}
    password: ${DB_PROD_PASSWORD}

  data:
    mongodb:
      uri: ${PROD_MONGO_URI}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        physical_naming_strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
        jdbc.time_zone: UTC
      open-in-view: false

logging:
  level:
    root: info

    org.hibernate: warn
    com.zaxxer.hikari: warn
    org.mongodb.driver: warn
    org.springframework.web: warn
    org.springframework.filter.CommonsRequestLoggingFilter: warn

    com.monew.monew_server: info
